  function num(v){ if(typeof v==="number") return isFinite(v)?v:NaN; var s=norm(v).replace(/[^0-9.]/g,""); var n=parseFloat(s); return isFinite(n)?n:NaN; }
  function byId(id){ for(var i=0;i<items.length;i++){ if(items[i].id===id) return items[i]; } return null; }
  function safeImg(u){ u=(u||"").trim(); return /^(https:\/\/|data:image\/)/i.test(u) ? u : ""; }
  function iconKey(it){
    var n=norm(it.cat+" "+it.name);
    if(n.indexOf("عسل")>-1) return "honey";
    if(n.indexOf("زبد")>-1) return "butter";
    if(n.indexOf("جبن")>-1) return "cheese";
    if(n.indexOf("لبن")>-1) return "milk";
    return "cream";
  }
  function cats(){ var out=[]; items.forEach(function(i){ if(out.indexOf(i.cat)<0) out.push(i.cat); }); return out; }
  function zoneObj(){ for(var i=0;i<zones.length;i++){ if(zones[i].name===zoneId) return zones[i]; } return null; }
  function totals(){
    var c=0,t=0,s=0,n=0;
    Object.keys(cart).forEach(function(k){
      var it=byId(k), q=cart[k]; if(!it) return;
      n++; c+=q; t+=q*it.price; if(it.old>it.price) s+=q*(it.old-it.price);
    });
    return {lines:n,count:c,total:t,saved:s};
  }
  function toast(msg){
    var el=$("#toast"); el.textContent=msg; el.hidden=false;
    clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true},3200);
  }

  /* ===== قراءة CSV ===== */
  function parseCSV(text){
    text=text.replace(/^﻿/,"");
    var rows=[],row=[],f="",q=false;
    for(var i=0;i<text.length;i++){
      var c=text.charAt(i);
      if(q){
        if(c==='"'){ if(text.charAt(i+1)==='"'){ f+='"'; i++; } else q=false; }
        else f+=c;
      } else if(c==='"') q=true;
      else if(c===","){ row.push(f); f=""; }
      else if(c==="\n"||c==="\r"){ if(c==="\r"&&text.charAt(i+1)==="\n") i++; row.push(f); f=""; rows.push(row); row=[]; }
      else f+=c;
    }
    if(f!==""||row.length){ row.push(f); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){ return x.trim()!==""; }); });
  }
  function normH(h){ return norm(h).replace(/[\s_\-]/g,""); }
  function col(head,aliases){
    var n=head.map(normH);
    for(var i=0;i<aliases.length;i++){ var k=n.indexOf(normH(aliases[i])); if(k>-1) return k; }
    return -1;
  }
  function parseItems(text){
    var rows=parseCSV(text); if(rows.length<2) return [];
    var h=rows[0];
    var cId=col(h,["id","الرقم","كود","م"]), cCat=col(h,["category","cat","القسم","الفئة"]),
        cName=col(h,["name","الاسم","الصنف","المنتج"]),
        cOld=col(h,["old","oldprice","السعر قبل الخصم","السعر قبل","قبل الخصم"]),
        cPrice=col(h,["price","السعر بعد الخصم","السعر بعد","بعد الخصم","السعر"]),
        cImg=col(h,["image","img","الصورة","صورة","رابط الصورة"]),
        cOk=col(h,["available","متاح","الحالة"]);
    if(cName<0||cPrice<0) return [];
    var out=[],seen={};
    rows.slice(1).forEach(function(r,idx){
      var name=(r[cName]||"").trim(), price=num(r[cPrice]);
      if(!name||!isFinite(price)) return;
      var id=cId>-1&&(r[cId]||"").trim()?r[cId].trim():String(idx+1);
      if(seen[id]) id=id+"-"+idx; seen[id]=1;
      var old=cOld>-1?num(r[cOld]):NaN;
      var okv=cOk>-1?norm(r[cOk]).trim():"";
      out.push({
        id:id, cat:(cCat>-1&&(r[cCat]||"").trim())||"الأصناف", name:name,
        old:isFinite(old)?old:price, price:price,
        img:cImg>-1?(r[cImg]||"").trim():(IMGS[id]||""),
        ok:!(okv==="لا"||okv==="no"||okv==="0"||okv==="false"||okv==="غيرمتاح"||okv==="غير متاح")
      });
    });
    return out;
  }
  function parseZones(text){
    var rows=parseCSV(text); if(rows.length<2) return [];
    var h=rows[0], cN=col(h,["name","zone","المنطقة","الاسم"]), cF=col(h,["fee","price","رسوم التوصيل","الرسوم","التوصيل","السعر"]);
    if(cN<0||cF<0) return [];
    var out=[];
    rows.slice(1).forEach(function(r){ var n=(r[cN]||"").trim(), f=num(r[cF]); if(n&&isFinite(f)) out.push({name:n,fee:f}); });
    return out;
  }

  /* ===== عرض المنيو ===== */
  function renderChips(){
    var all=[{n:"all",t:"الكل"}].concat(cats().map(function(c){ return {n:c,t:c}; }));
    chips.innerHTML = all.map(function(c){
      return '<button type="button" class="chip" data-cat="'+esc(c.n)+'" aria-pressed="'+(filterCat===c.n)+'">'+esc(c.t)+'</button>';
    }).join("");
  }
  function control(it){
    if(!it.ok) return '<span class="na-tag">غير متاح حاليًا</span>';
    var q = cart[it.id]||0, id=esc(it.id);
    if(!q) return '<button type="button" class="add" data-act="add" data-id="'+id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>إضافة للسلة</button>';
    return '<div class="step" role="group" aria-label="الكمية"><button type="button" class="plus" data-act="inc" data-id="'+id+'" aria-label="زيادة">+</button><output>'+q+'</output><button type="button" data-act="dec" data-id="'+id+'" aria-label="تقليل">−</button></div>';
  }
  function card(it){
    var has = it.old>it.price, pct = has?Math.round((it.old-it.price)/it.old*100):0;
    var k=iconKey(it), im=safeImg(it.img);
    var ico = im
      ? '<div class="ico"><img src="'+esc(im)+'" alt="'+esc(it.name)+'" loading="lazy" data-k="'+k+'"></div>'
      : '<div class="ico fb '+k+'">'+ICON[k]+'</div>';
    return '<article class="card'+(it.ok?'':' na')+'">'+ico+
      '<div class="info"><h3 class="name">'+esc(it.name)+'</h3><div class="prices"><span class="now">'+fmt(it.price)+'<small>ج.م</small></span>'+
      (has?'<span class="was">'+fmt(it.old)+' ج.م</span><span class="off">خصم '+pct+'%</span>':'')+'</div></div>'+
      '<div class="act">'+control(it)+'</div></article>';
  }
  function renderMenu(){
    var nq = norm(query.trim()), html = "";
    cats().forEach(function(c){
      if(filterCat!=="all" && filterCat!==c) return;
      var list = items.filter(function(i){ return i.cat===c && (!nq || norm(i.name).indexOf(nq)>-1 || norm(c).indexOf(nq)>-1); });
      if(!list.length) return;
      html += '<section class="group"><h2>'+esc(c)+'</h2><div class="grid">'+list.map(card).join("")+'</div></section>';
    });
    menu.innerHTML = html || '<div class="empty">لا يوجد صنف بهذا الاسم. جرّب كلمة أخرى مثل «عسل» أو «قشطة».</div>';
  }
  function renderBar(){
    var t=totals();
    bar.hidden = t.count===0;
    $("#barCount").textContent = t.count;
    $("#barTotal").textContent = fmt(t.total)+" ج.م";
  }
  function setQty(id,delta){
    var it=byId(id); if(!it||!it.ok) return;
    var q=(cart[id]||0)+delta;
    if(q<=0) delete cart[id]; else cart[id]=Math.min(q,99);
    renderMenu(); renderBar();
    if(!overlay.hidden) renderCart(true);
  }

  /* ===== السلة ===== */
  function sumHtml(){
    var t=totals(), z=zoneObj(), fee=z?z.fee:0;
    return '<div><span>عدد الأصناف</span><span>'+t.lines+' ('+t.count+' وحدة)</span></div>'+
      '<div><span>المنتجات</span><span>'+fmt(t.total)+' ج.م</span></div>'+
      (t.saved?'<div class="save"><span>وفّرت من الخصم</span><span>'+fmt(t.saved)+' ج.م</span></div>':'')+
      '<div><span>رسوم التوصيل'+(z?' — '+esc(z.name):'')+'</span><span>'+(z?fmt(z.fee)+' ج.م':'اختر المنطقة')+'</span></div>'+
      '<div class="total"><span>الإجمالي</span><span>'+fmt(t.total+fee)+' ج.م</span></div>';
  }
  function updateSum(){ var b=$("#sumBox"); if(b) b.innerHTML=sumHtml(); }

    var keys=Object.keys(cart).filter(function(k){ return byId(k); });

    cartBody.innerHTML =

        '<label for="cName"><span>الاسم <em>*</em></span><input type="text" id="cName" autocomplete="name" placeholder="اسمك الكريم"><span class="err" id="eName"></span></label>'+
        '<label for="cZone"><span>المنطقة <em>*</em></span><select id="cZone"><option value="">اختر منطقتك</option>'+zones.map(function(z){return '<option value="'+esc(z.name)+'">'+esc(z.name)+' — توصيل '+fmt(z.fee)+' ج.م</option>';}).join("")+'</select><span class="err" id="eZone"></span></label>'+
        '<label for="cAddr"><span>العنوان بالتفصيل <em>*</em></span><textarea id="cAddr" autocomplete="street-address" placeholder="الشارع، رقم المبنى والدور، أقرب علامة مميزة"></textarea><span class="err" id="eAddr"></span></label>'+
        '<label for="cNote"><span>ملاحظات على الأوردر</span><textarea id="cNote" placeholder="مثال: رقم موبايل آخر، وقت التوصيل المناسب"></textarea></label>'+
      '</fieldset>'+
      '<a class="send" id="send" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>إرسال الطلب عبر واتساب</a>'+
      '<p class="hint">سيُفتح واتساب برسالة جاهزة فيها فاتورة الطلب. اضغط «إرسال» داخل المحادثة لتأكيده، وسنراجعه معك هناك.</p></form>';
    $("#cZone").value = zoneId;
    $("#cName").value = draft ? (draft.n||"") : saved.name;
    $("#cAddr").value = draft ? (draft.a||"") : saved.address;
    $("#cNote").value = draft ? (draft.o||"") : "";
  }

  function buildMessage(name,addr,note){
    var t=totals(), z=zoneObj(), L=[], bar="━━━━━━━━━━━━━━━";
    var when=new Date().toLocaleString("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});
    L.push("🧾 *طلب جديد — "+CONFIG.STORE+"*");
    L.push("🗓 "+when);
    L.push("");
    L.push(bar);
    L.push("🛍 *قائمة الأصناف*");
    L.push("");
    Object.keys(cart).forEach(function(k){
      var it=byId(k), q=cart[k]; if(!it) return;
      L.push("▫️ "+q+" × "+it.name+" — "+fmt(it.price)+" ج.م للوحدة = *"+fmt(q*it.price)+" ج.م*");
    });
    L.push("");
    L.push(bar);
    L.push("💳 *تفاصيل الأوردر*");
    L.push("");
    L.push("🔢 عدد الأصناف: "+t.lines+" ("+t.count+" وحدة)");
    L.push("🛒 مجموع المنتجات: "+fmt(t.total)+" ج.م");
    L.push("🏷 الخصم الموفّر: "+fmt(t.saved)+" ج.م");
    L.push("🛵 رسوم التوصيل ("+z.name+"): "+fmt(z.fee)+" ج.م");
    L.push("✅ *الإجمالي النهائي بعد الخصم: "+fmt(t.total+z.fee)+" ج.م*");
    L.push("");
    L.push(bar);
    L.push("📍 *بيانات التوصيل*");
    L.push("");
    L.push("🚚 طريقة التوصيل: التوصيل إلى المنزل");
    L.push("🗺 المنطقة: "+z.name);
    L.push("👤 اسم العميل: "+name);
    L.push("🏠 العنوان: "+addr);
    if(note) L.push("📝 ملاحظات: "+note);
    return L.join("\n");
  }

  function openCart(){
    renderCart(false);
    overlay.hidden=false;
    document.body.style.overflow="hidden";
    var x=$("#closeCart"); if(x) x.focus();
  }
  function closeCart(){
    overlay.hidden=true;
    document.body.style.overflow="";
    var b=$("#openCart"); if(b && !bar.hidden) b.focus();
  }

  /* ===== التحديث التلقائي من Google Sheets ===== */
  function setStat(ok){
    var el=$("#stat"); if(!CONFIG.SHEET_CSV_URL){ el.hidden=true; return; }
    el.hidden=false;
    if(ok){ everLoaded=true; el.className="stat ok"; el.textContent="الأسعار تتحدّث تلقائيًا من الجدول · آخر تحديث "+new Date().toLocaleTimeString("ar-EG-u-nu-latn",{hour:"2-digit",minute:"2-digit"}); }
    else { el.className="stat bad"; el.textContent = everLoaded ? "تعذّر الاتصال بالجدول الآن، والأسعار المعروضة هي آخر نسخة محمّلة." : "تعذّر تحميل الجدول، والأسعار المعروضة هي النسخة الافتراضية."; }
  }
  function applyItems(list){
    var sig=JSON.stringify(list);
    if(sig===itemsSig) return;
    itemsSig=sig; items=list;
    Object.keys(cart).forEach(function(k){ var it=byId(k); if(!it||!it.ok) delete cart[k]; });
    if(filterCat!=="all" && cats().indexOf(filterCat)<0) filterCat="all";
    renderChips(); renderMenu(); renderBar();
    if(!overlay.hidden) renderCart(true);
  }
  function applyZones(list){
    var sig=JSON.stringify(list);
    if(sig===zonesSig) return;
    zonesSig=sig; zones=list;
    if(!overlay.hidden) renderCart(true);
  }
  function bust(u){ return u+(u.indexOf("?")>-1?"&":"?")+"_="+Date.now(); }
  function load(){
    if(CONFIG.SHEET_CSV_URL){
      fetch(bust(CONFIG.SHEET_CSV_URL),{cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("http"); return r.text(); })
        .then(function(t){ var l=parseItems(t); if(!l.length) throw new Error("empty"); applyItems(l); setStat(true); })
        .catch(function(){ setStat(false); });
    }
    if(CONFIG.ZONES_CSV_URL){
      fetch(bust(CONFIG.ZONES_CSV_URL),{cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("http"); return r.text(); })
        .then(function(t){ var l=parseZones(t); if(l.length) applyZones(l); })
        .catch(function(){});
    }
  }

  /* ===== الأحداث ===== */

    var b=e.target.closest(".chip"); if(!b) return;
    filterCat=b.getAttribute("data-cat"); renderChips(); renderMenu();
  });
  $("#q").addEventListener("input",function(e){ query=e.target.value; renderMenu(); });

  },true);
  cartBody.addEventListener("click",function(e){
    if(e.target.id==="back"){ closeCart(); return; }
    var s=e.target.closest("#send");

      var name=$("#cName").value.trim(), addr=$("#cAddr").value.trim(), note=$("#cNote").value.trim();

      if(!ok){ e.preventDefault(); (!name ? $("#cName") : !zoneObj() ? $("#cZone") : $("#cAddr")).focus(); return; }
      try{ localStorage.setItem("zain-cust",JSON.stringify({name:name,address:addr,zone:zoneId})); }catch(err){}
      s.href="https://wa.me/"+CONFIG.WHATSAPP+"?text="+encodeURIComponent(buildMessage(name,addr,note));
      toast("تم تجهيز الفاتورة. اضغط «إرسال» داخل واتساب لإتمام الطلب.");
      return;
    }
    handleAct(e);
  });
  cartBody.addEventListener("change",function(e){
    if(e.target.id==="cZone"){
      zoneId=e.target.value; updateSum();
      try{ var c=JSON.parse(localStorage.getItem("zain-cust")||"{}"); c.zone=zoneId; localStorage.setItem("zain-cust",JSON.stringify(c)); }catch(err){}
    }
  });
  $("#openCart").addEventListener("click",openCart);
  $("#closeCart").addEventListener("click",closeCart);

  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !overlay.hidden) closeCart(); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });

  /* ===== وضع الإدارة (يظهر لصاحب الصفحة فقط) ===== */

  function admRender(){
    var cs=[]; draft.items.forEach(function(i){ if(i.cat && cs.indexOf(i.cat)<0) cs.push(i.cat); });
    var h='<p class="adm-note">عدّل الأسعار والأسماء ثم اضغط «حفظ ونشر». يظهر التعديل للزبائن عند فتح المنيو.</p>'+

      '<h3 class="adm-h">الأصناف</h3>';
    draft.items.forEach(function(it,i){
      h+='<div class="adm-item" data-i="'+i+'">'+
        '<div class="adm-top"><div class="adm-thumb">'+thumbHtml(it)+'</div><div class="adm-f">'+
          '<label for="an'+i+'"><span>اسم الصنف</span><input type="text" id="an'+i+'" data-k="name" value="'+esc(it.name)+'"></label>'+
          '<label for="ac'+i+'"><span>القسم</span><input type="text" id="ac'+i+'" data-k="cat" list="admCats" value="'+esc(it.cat)+'"></label>'+
        '</div></div>'+
        '<div class="adm-nums">'+
          '<label for="ao'+i+'"><span>قبل الخصم</span><input type="text" inputmode="decimal" id="ao'+i+'" data-k="old" value="'+rawVal(it,"old")+'"></label>'+
          '<label for="ap'+i+'"><span>بعد الخصم</span><input type="text" inputmode="decimal" id="ap'+i+'" data-k="price" value="'+rawVal(it,"price")+'"></label>'+
          '<label class="adm-chk" for="ak'+i+'"><input type="checkbox" id="ak'+i+'" data-k="ok"'+(it.ok!==false?' checked':'')+'><span>متاح</span></label>'+
        '</div>'+
        '<div class="adm-act"><label class="ghost sm" for="ai'+i+'">تغيير الصورة</label><input class="vh" type="file" accept="image/*" id="ai'+i+'" data-k="img">'+
        '<button type="button" class="ghost sm danger" data-adm="del" data-i="'+i+'">حذف الصنف</button></div></div>';
    });
    h+='<button type="button" class="ghost" data-adm="addItem">+ إضافة صنف</button>'+
      '<h3 class="adm-h">مناطق التوصيل</h3>';
    draft.zones.forEach(function(z,i){
      h+='<div class="adm-zone" data-z="'+i+'">'+
        '<label for="zn'+i+'"><span>المنطقة</span><input type="text" id="zn'+i+'" data-k="name" value="'+esc(z.name)+'"></label>'+
        '<label for="zf'+i+'"><span>الرسوم (ج.م)</span><input type="text" inputmode="decimal" id="zf'+i+'" data-k="fee" value="'+rawVal(z,"fee")+'"></label>'+
        '<button type="button" class="ghost sm danger" data-adm="delZone" data-z="'+i+'">حذف</button></div>';
    });
    h+='<button type="button" class="ghost" data-adm="addZone">+ إضافة منطقة</button>'+
      '<div class="adm-err" id="admErr" role="alert"></div>'+
      '<button type="button" class="send adm-save" id="admSave" data-adm="save">حفظ ونشر التعديلات</button>';
    admBody.innerHTML=h;
  }
  function admOpenSheet(){
    draft={items:JSON.parse(JSON.stringify(items)),zones:JSON.parse(JSON.stringify(zones))};
    admRender(); admOverlay.hidden=false; document.body.style.overflow="hidden";
  }
  function admCloseSheet(){ admOverlay.hidden=true; document.body.style.overflow=""; }
  function resizeImg(file,cb){
    var fr=new FileReader();
    fr.onerror=function(){ cb(null); };
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){ cb(null); };
      im.onload=function(){
        var sc=Math.min(1,480/Math.max(im.width,im.height)), c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
        var g=c.getContext("2d"); g.fillStyle="#f3f8e3"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  function admFail(msg){ $("#admErr").textContent=msg; }
  function admSave(){
    $("#admErr").textContent="";
    var outItems=[], outZones=[], i, it, z;
    for(i=0;i<draft.items.length;i++){
      it=draft.items[i];
      var name=(it.name||"").trim();
      if(!name) return admFail("اكتب اسمًا لكل صنف، أو احذف الصنف الفارغ.");
      var price=num(it._price!==undefined?it._price:it.price);
      if(!isFinite(price)||price<0) return admFail("السعر بعد الخصم غير صحيح في: "+name);
      var old=(it._old!==undefined && String(it._old).trim()==="") ? price : num(it._old!==undefined?it._old:it.old);
      if(!isFinite(old)) return admFail("السعر قبل الخصم غير صحيح في: "+name);
      outItems.push({id:it.id,cat:(it.cat||"").trim()||"الأصناف",name:name,old:Math.max(old,price),price:price,img:it.img||"",ok:it.ok!==false});
    }
    for(i=0;i<draft.zones.length;i++){
      z=draft.zones[i];
      var zn=(z.name||"").trim(), fee=num(z._fee!==undefined?z._fee:z.fee);
      if(!zn) return admFail("اكتب اسم كل منطقة، أو احذف المنطقة الفارغة.");
      if(!isFinite(fee)||fee<0) return admFail("رسوم التوصيل غير صحيحة في: "+zn);
      outZones.push({name:zn,fee:fee});
    }
    if(!outItems.length) return admFail("أضف صنفًا واحدًا على الأقل.");
    var btn=$("#admSave"); btn.disabled=true; btn.textContent="جارٍ النشر…";
    artNS.publish(buildDoc({v:1,items:outItems,zones:outZones})).catch(function(e){
      btn.disabled=false; btn.textContent="حفظ ونشر التعديلات";
      var c=e&&e.code;
      admFail(c==="conflict" ? "نُشرت نسخة أحدث من الصفحة وسيُعاد تحميلها. أعد التعديل بعدها."
        : (c==="not_writer"||c==="not_granted") ? "ليس لديك صلاحية النشر على هذه الصفحة."
        : c==="too_large" ? "حجم الصفحة كبير. احذف بعض الصور المرفوعة وحاول مرة أخرى."
        : c==="rate_limited" ? "تكرر النشر بسرعة. انتظر دقيقة ثم حاول."
        : "تعذّر النشر. حاول مرة أخرى.");
    });
  }
  admBody.addEventListener("input",function(e){
    var t=e.target, k=t.getAttribute("data-k"); if(!k||k==="ok"||k==="img") return;
    var ri=t.closest("[data-i]"), rz=t.closest("[data-z]");
    if(ri){ var it=draft.items[+ri.getAttribute("data-i")]; if(k==="name"||k==="cat") it[k]=t.value; else it["_"+k]=t.value; }
    else if(rz){ var z=draft.zones[+rz.getAttribute("data-z")]; if(k==="name") z.name=t.value; else z._fee=t.value; }
  });
  admBody.addEventListener("change",function(e){
    var t=e.target, k=t.getAttribute("data-k"), row=t.closest("[data-i]"); if(!row) return;
    var it=draft.items[+row.getAttribute("data-i")];
    if(k==="ok") it.ok=t.checked;
    if(k==="img" && t.files && t.files[0]){
      resizeImg(t.files[0],function(d){
        if(!d) return admFail("تعذّر قراءة الصورة. اختر صورة أخرى.");
        it.img=d; row.querySelector(".adm-thumb").innerHTML=thumbHtml(it); $("#admErr").textContent="";
      });
    }
  });
  admBody.addEventListener("click",function(e){
    var b=e.target.closest("[data-adm]"); if(!b) return;
    var a=b.getAttribute("data-adm");
    if(a==="save"){ admSave(); return; }
    if(a==="addItem"){
      var last=draft.items.length?draft.items[draft.items.length-1].cat:"الأصناف";
      draft.items.push({id:"n"+Date.now().toString(36),cat:last,name:"",old:0,price:0,img:"",ok:true});
      admRender(); var f=$("#an"+(draft.items.length-1)); if(f){ f.scrollIntoView({block:"center"}); f.focus(); } return;
    }
    if(a==="addZone"){
      draft.zones.push({name:"",fee:0}); admRender(); var g=$("#zn"+(draft.zones.length-1)); if(g){ g.scrollIntoView({block:"center"}); g.focus(); } return;
    }
    if(a==="del"||a==="delZone"){
      if(b.getAttribute("data-armed")!=="1"){ b.setAttribute("data-armed","1"); b.textContent="اضغط للتأكيد"; return; }
      if(a==="del") draft.items.splice(+b.getAttribute("data-i"),1); else draft.zones.splice(+b.getAttribute("data-z"),1);
      admRender();
    }
  });
  var PW_HASH = "893c68ad2fa25e05de0a506311ae518ef57cec0561a183623f87b6559a62f12e";
  var pwOverlay = $("#pwOverlay"), pwInput = $("#pwInput"), pwErr = $("#pwErr"), pwFails = 0, pwLockUntil = 0;
  function sha256Hex(s){
    if(!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error("nosubtle"));
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
    });
  }
  function pwOpen(){ pwErr.textContent=""; pwInput.value=""; pwOverlay.hidden=false; document.body.style.overflow="hidden"; pwInput.focus(); }
  function pwClose(){ pwOverlay.hidden=true; pwInput.value=""; if(admOverlay.hidden) document.body.style.overflow=""; }
  $("#pwForm").addEventListener("submit",function(e){
    e.preventDefault();
    var now=Date.now();
    if(now<pwLockUntil){ pwErr.textContent="محاولات خاطئة كثيرة. انتظر "+Math.ceil((pwLockUntil-now)/1000)+" ثانية ثم حاول."; return; }
    sha256Hex(pwInput.value).then(function(h){
      if(h===PW_HASH){ pwFails=0; pwClose(); admOpenSheet(); return; }
      pwFails++; pwInput.value="";
      if(pwFails>=5){ pwFails=0; pwLockUntil=Date.now()+30000; pwErr.textContent="كلمة المرور غير صحيحة. أُوقفت المحاولات 30 ثانية."; }
      else pwErr.textContent="كلمة المرور غير صحيحة.";
      pwInput.focus();
    }).catch(function(){ pwErr.textContent="تعذّر التحقق من كلمة المرور في هذا المتصفح."; });
  });
  $("#pwClose").addEventListener("click",pwClose);
  pwOverlay.addEventListener("click",function(e){ if(e.target===pwOverlay) pwClose(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !pwOverlay.hidden) pwClose(); });
  $("#admOpen").addEventListener("click",pwOpen);
  $("#admClose").addEventListener("click",admCloseSheet);
  admOverlay.addEventListener("click",function(e){ if(e.target===admOverlay) admCloseSheet(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && !admOverlay.hidden) admCloseSheet(); });
  try{
    if(window.claude && window.claude.use){
      Promise.all([window.claude.use("user"),window.claude.use("artifact")]).then(function(r){
        if(!r[0]||!r[1]) return;
        return r[0].canEdit().then(function(ok){ if(ok){ artNS=r[1]; $("#admOpen").hidden=false; } });
      }).catch(function(){});
    }
  }catch(err){}

  renderChips(); renderMenu(); renderBar();
  load();
  if(CONFIG.SHEET_CSV_URL||CONFIG.ZONES_CSV_URL) setInterval(load,Math.max(5,CONFIG.REFRESH_SECONDS)*1000);
})();
</script>
